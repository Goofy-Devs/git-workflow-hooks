-   id: check-submodules
    name: check-submodules
    description: "Checks the submodule directory provided and compares them to their remote."
    entry: ./check-submodules.sh
    language: script
    always_run: true
    pass_filenames: false
-   id: check-main
    name: check-main
    description: "Checks current branch to see if there's a merge conflict with main."
    entry: ./check-main.sh
    language: script
    always_run: true
    pass_filenames: false
