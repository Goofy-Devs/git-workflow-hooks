-   id: check-submodules
    name: check-submodules
    description: "Checks the submodule directory provided and compares them to their remote."
    entry: check_submodules.py
    language: script
    always_run: true
    pass_filenames: false
-   id: check-remote
    name: check-remote
    description: "Checks current branch to see if there's a merge conflict with remote."
    entry: check_remote.py
    language: script
    always_run: true
    pass_filenames: false
